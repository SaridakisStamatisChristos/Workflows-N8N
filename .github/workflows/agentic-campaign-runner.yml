name: Agentic coding campaign runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Stable engineering task identifier used for idempotency
        required: true
        type: string
      task_json:
        description: Normalized EngineeringTask JSON from the deterministic intake gate
        required: true
        type: string
      change_set_json:
        description: Bounded AgentChangeSet JSON proposed by the coding model
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentic-campaign-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  isolated-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materialize dispatch contracts safely
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
          TASK_JSON: ${{ inputs.task_json }}
          CHANGE_SET_JSON: ${{ inputs.change_set_json }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          task = json.loads(os.environ['TASK_JSON'])
          change = json.loads(os.environ['CHANGE_SET_JSON'])
          task_id = os.environ['INPUT_TASK_ID']
          if task.get('task_id') != task_id or change.get('task_id') != task_id:
              raise SystemExit('task_id mismatch across workflow-dispatch contracts')
          payload_chars = len(os.environ['TASK_JSON']) + len(os.environ['CHANGE_SET_JSON']) + len(task_id)
          if payload_chars > 60000:
              raise SystemExit('workflow-dispatch contract exceeds 60000-character safety budget')
          (temp / 'agent-task.json').write_text(json.dumps(task), encoding='utf-8')
          (temp / 'agent-change-set.json').write_text(json.dumps(change), encoding='utf-8')
          PY
      - name: Execute verified change-set in Docker sandbox
        run: |
          python -m agentic_engineering.campaign \
            --source "$GITHUB_WORKSPACE" \
            --task "$RUNNER_TEMP/agent-task.json" \
            --change-set "$RUNNER_TEMP/agent-change-set.json" \
            --mode docker \
            --artifact-dir "$RUNNER_TEMP/agent-artifacts" \
            --materialize-dir "$RUNNER_TEMP/verified-tree" \
            --apply-verified-to-source
      - name: Read trusted campaign metadata
        id: meta
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'agent-artifacts'/'metadata.json').read_text())
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as f:
              f.write(f"branch_fragment={m['branch_fragment']}\n")
              f.write(f"base_ref={m['base_ref']}\n")
              f.write(f"pr_title={m['pr_title']}\n")
          PY
      - name: Assert base branch policy
        env:
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
        run: |
          test "$BASE_REF" = "main" || { echo "Only main is an approved base ref"; exit 1; }
      - name: Commit verified tree to isolated branch
        env:
          BRANCH_FRAGMENT: ${{ steps.meta.outputs.branch_fragment }}
        run: |
          test -n "$(git status --porcelain)" || { echo "No verified source changes"; exit 1; }
          BRANCH="agent/${BRANCH_FRAGMENT}"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "A branch already exists for this stable task id; refusing duplicate publication." >&2
            exit 1
          fi
          git config user.name "agentic-engineering-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "agent: verified ${BRANCH_FRAGMENT}"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Create draft PR only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.meta.outputs.pr_title }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/agent-artifacts/pr-body.md"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentic-campaign-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-artifacts/
          if-no-files-found: warn
